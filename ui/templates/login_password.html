<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Pelidum MPAC</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;700&family=Orbitron:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

    <style>
        /* 1. THEME VARIABLES (Same as login.html) */
        :root {
            /* Light Theme */
            --color-bg-primary: #f6f6f6;
            --color-bg-secondary: #ffffff;

            --color-text-primary: #11233e;
            --color-text-secondary: #555555;
            --color-text-on-accent: #11233e;

            --color-accent-primary: #cca139;
            --color-accent-primary-rgb: 204, 161, 57;
            --color-accent-secondary: #aa914f;
            --color-border: #c3cddc;

            --font-body: "Inter", sans-serif;
            --font-logo: "Poppins", sans-serif;
            --font-mpac: "Orbitron", sans-serif;
        }

        /* Dark Theme */
        html.dark {
            --color-bg-primary: #121212;
            --color-bg-secondary: #212121;

            --color-text-primary: #e0e0e0;
            --color-text-secondary: #9e9e9e;
            --color-text-on-accent: #000000;

            --color-accent-primary: #aa914f;
            --color-accent-primary-rgb: 170, 145, 79;
            --color-border: #424242;
        }

        /* 2. RESET & LAYOUT */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 3. CARD STYLES */
        .login-card {
            background-color: var(--color-bg-secondary);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--color-border);
            position: relative;
        }

        /* 4. TYPOGRAPHY */
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-title {
            font-family: var(--font-logo);
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            font-family: var(--font-mpac);
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--color-text-secondary);
            letter-spacing: 2px;
        }

        /* 5. FORM ELEMENTS */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text-primary);
        }

        .input-field {
            width: 100%;
            background-color: var(--color-bg-primary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--color-text-primary);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--color-accent-primary);
            box-shadow: 0 0 0 3px rgba(var(--color-accent-primary-rgb), 0.15);
        }

        /* 6. BUTTONS */
        .btn-submit {
            width: 100%;
            background-color: var(--color-accent-secondary);
            color: var(--color-text-on-accent);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--color-accent-primary);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Back Button (Top Left) */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 8px;
            border-radius: 50%;
            transition: color 0.2s, background-color 0.2s;
        }

        .btn-back:hover {
            color: var(--color-text-primary);
            background-color: rgba(var(--color-accent-primary-rgb), 0.1);
        }

        /* Flash Messages */
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(220, 53, 69, 0.15);
            /* Red tint */
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>
</head>

<body>

    <div class="login-card">

        <a href="{{ url_for('login') }}{% if next_url|default('') %}?next={{ next_url }}{% endif %}" class="btn-back" title="Back to sign in options">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="brand-header">
            <h1 class="brand-title">Pelidum</h1>
            <p class="brand-subtitle">MPAC</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-error">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login_password') }}">
            {% if next_url|default('') %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username"
                    required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="input-field"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">
                Sign In
            </button>
        </form>

    </div>

    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { }
        })();
    </script>

</body>

</html>
