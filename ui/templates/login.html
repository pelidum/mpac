<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title|default('Login') }} - Pelidum Trust & Safety</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;700&family=Orbitron:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    /* 1. THEME VARIABLES 
       Using your specific color palette
    */
    :root {
      /* Light Theme */
      --color-bg-primary: #f6f6f6;
      --color-bg-secondary: #ffffff;

      --color-text-primary: #11233e;
      --color-text-secondary: #555555;

      --color-accent-primary: #cca139;
      --color-accent-secondary: #aa914f;
      --color-border: #c3cddc;

      --font-body: "Inter", sans-serif;
      --font-logo: "Poppins", sans-serif;
      --font-mpac: "Orbitron", sans-serif;
    }

    /* Dark Theme */
    html.dark {
      --color-bg-primary: #121212;
      --color-bg-secondary: #212121;

      --color-text-primary: #e0e0e0;
      --color-text-secondary: #9e9e9e;

      --color-accent-primary: #aa914f;
      --color-border: #424242;
    }

    /* 2. RESET & LAYOUT */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 3. COMPONENT: CARD */
    .login-card {
      background-color: var(--color-bg-secondary);
      width: 100%;
      max-width: 450px;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      border: 1px solid var(--color-border);
    }

    /* 4. TYPOGRAPHY */
    .brand-title {
      font-family: var(--font-logo);
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 0.25rem;
    }

    .brand-subtitle {
      font-family: var(--font-mpac);
      /* Orbitron */
      font-weight: 700;
      /* Bold */
      font-size: 1.5rem;
      /* Bumped size slightly for the font */
      color: var(--color-text-secondary);
      margin-bottom: 2.5rem;
      letter-spacing: 2px;
    }

    /* 5. BUTTON STACK */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-provider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.1s, opacity 0.2s;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn-provider:hover {
      opacity: 0.9;
    }

    .btn-provider:active {
      transform: scale(0.98);
    }

    .btn-provider i {
      font-size: 1.25rem;
      margin-right: 12px;
      width: 24px;
      text-align: center;
    }

    /* -- Button Colors -- */
    .btn-google {
      background-color: #34A853;
      color: #ffffff;
    }

    .btn-facebook {
      background-color: #1877F2;
      color: #ffffff;
    }

    .btn-microsoft {
      background-color: #00A3EE;
      color: #ffffff;
    }

    /* Password Button (Theme Gold) */
    .btn-password {
      background-color: var(--color-accent-secondary);
      color: #11233e;
    }

    html.dark .btn-password {
      color: #000000;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="brand-header">
      <h1 class="brand-title">Pelidum</h1>
      <p class="brand-subtitle">MPAC</p>
    </div>

    <div class="btn-stack">

      <a href="{{ url_for('authorize', provider='google') }}{% if next_url|default('') %}?next={{ next_url }}{% endif %}" class="btn-provider btn-google">
        <i class="fab fa-google"></i>
        <span>Login with Google</span>
      </a>

      <a href="{{ url_for('login_password') }}{% if next_url|default('') %}?next={{ next_url }}{% endif %}" class="btn-provider btn-password">
        <i class="fas fa-key"></i>
        <span>Login with Password</span>
      </a>

    </div>
  </div>

  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>

</body>

</html>
