[workspace]
members = [
    "mpac",
    "mpac_api",
    "mpac_auth",
    "mpac_blob",
    "mpac_db",
    "mpac_http",
    "mpac_inference",
    "mpac_proto",
    "mpac_queue",
    "mpac_secrets",
    "mpac_testing",
    "mpac_worker",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
infer = "0.22.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "gcp-base", "reqwest", "ring"] }
pbkdf2 = "0.13.0"
prost = "0.14.4"
prost-build = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14.4"
rand = "0.10.3"
regex = "1.13.1"
ring = "0.17"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.19"
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tonic-reflection = "0.14.9"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"
