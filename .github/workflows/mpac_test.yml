name: MPAC Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "cli/**"
      - "proto/**"
      - "ui/**"
      - "tests/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "proto/**"
      - "ui/**"
      - "tests/**"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"

jobs:
  unit-tests:
    name: MPAC Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-unit
          repository-cache: true

      - name: Run MPAC unit tests
        run: |
          bazel test \
            --test_output=errors \
            --keep_going \
            -- \
            //proto/... //cli/... \
            //ui/...
