name: MPAC images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "proto/**"
      - "ui/**"

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust, Schema, Contract, Resilience and Image Checks
    uses: ./.github/workflows/mpac_rust.yml

  python-checks:
    name: Proto, CLI and UI Checks
    uses: ./.github/workflows/mpac_test.yml

  mpac-server-actions:
    name: Build and Push Images
    needs: [rust-checks, python-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build / Push MPAC Server Docker Image
        run: bazel run --config=release //server/mpac:mpac_image_push

      - name: Build / Push MPAC UI Docker Image
        run: bazel run //ui:mpac_ui_image_push
