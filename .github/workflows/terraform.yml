name: Terraform checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: fmt / validate / test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform/on_prem, terraform/gcloud]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # Offline plan tests with mocked providers; no cloud credentials needed.
      - name: Test
        if: hashFiles(format('{0}/tests/*.tftest.hcl', matrix.dir)) != ''
        run: terraform test

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Lint
        run: |
          tflint --init
          # Warnings are reported but only errors fail the build.
          tflint --format compact --minimum-failure-severity=error
